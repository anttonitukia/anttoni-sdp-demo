name: Deploy Semarchy Data Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download and Install Semarchy Design CLI
        run: |
          # Download the CLI package (adjust URL to your download location)
          curl -L -o semarchy-cli.zip "${{ vars.SEMARCHY_CLI_DOWNLOAD_URL }}"
          
          # Extract ZIP (but not the inner TGZ)
          unzip -q semarchy-cli.zip
          
          # Find and install the TGZ package
          TGZ_FILE=$(find . -name "semarchy-sem-design-*.tgz" -type f | head -n 1)
          
          if [ -z "$TGZ_FILE" ]; then
            echo "❌ TGZ package not found"
            exit 1
          fi
          
          echo "Installing $TGZ_FILE"
          npm install -g "$TGZ_FILE"
          
          # Verify installation
          sem-design --help

      - name: Authenticate with Semarchy
        run: |
          sem-design auth login ${{ vars.SEMARCHY_INSTANCE_URL }}
        env:
          # The CLI may need credentials passed via environment variables or stdin
          SEMARCHY_API_KEY: ${{ secrets.SEMARCHY_API_KEY }}
          SEMARCHY_CLIENT_ID: ${{ secrets.SEMARCHY_CLIENT_ID }}
          SEMARCHY_CLIENT_SECRET: ${{ secrets.SEMARCHY_CLIENT_SECRET }}

      - name: Deploy to Data Management
        run: |
          sem-design dm data-location deploy \
            --api-key ${{ secrets.SEMARCHY_API_KEY }} \
            --client-id ${{ secrets.SEMARCHY_CLIENT_ID }} \
            --client-secret ${{ secrets.SEMARCHY_CLIENT_SECRET }} \
            --data-location ${{ vars.SEMARCHY_DATA_LOCATION }} \
            --data-source ${{ vars.SEMARCHY_DATA_SOURCE }} \
            --instance-url ${{ vars.SEMARCHY_INSTANCE_URL }} \
            --root-folder ./
        
      - name: Check deployment status
        if: success()
        run: echo "✅ Deployment completed successfully"
        
      - name: Handle deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed - check logs above"
          exit 1
