name: Deploy Semarchy

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Automatically select environment based on branch
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      # Add Java setup for Flyway
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Set up SSH key
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            # Create SSH tunnel with detailed error logging
      - name: Create SSH tunnel to database
        id: ssh_tunnel
        run: |
          # Don't exit on error immediately - we want to see what happens
          set +e
          
          echo "Step 1: Adding SSH host to known_hosts..."
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          
          echo "Step 2: Testing SSH connection..."
          SSH_OUTPUT=$(ssh -v \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=60 \
            -o MACs=hmac-sha2-256 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH connection successful'" 2>&1)
          SSH_EXIT_CODE=$?
          
          echo "$SSH_OUTPUT"
          
          if [ $SSH_EXIT_CODE -eq 0 ]; then
            echo "✅ SSH connection test passed"
          else
            echo "❌ SSH connection failed with exit code: $SSH_EXIT_CODE"
            echo "Full SSH debug output above ^"
            exit 1
          fi
          
          echo "Step 3: Creating SSH tunnel..."
          echo "  Local port: ${{ vars.LOCAL_PORT }}"
          echo "  Remote host: ${{ secrets.DB_HOST }}"
          echo "  Remote port: ${{ secrets.DB_PORT }}"
          
          # Create tunnel and capture output
          TUNNEL_OUTPUT=$(ssh -v -f -N \
            -o ServerAliveInterval=60 \
            -o MACs=hmac-sha2-256 \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=no \
            -L ${{ vars.LOCAL_PORT }}:${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 2>&1)
          TUNNEL_EXIT_CODE=$?
          
          echo "$TUNNEL_OUTPUT"
          
          if [ $TUNNEL_EXIT_CODE -ne 0 ]; then
            echo "❌ SSH tunnel creation failed with exit code: $TUNNEL_EXIT_CODE"
            exit 1
          fi
          
          # Wait for tunnel to establish
          sleep 5
          
          # Verify tunnel is running
          if pgrep -f "ssh.*-L.*${{ vars.LOCAL_PORT }}" > /dev/null; then
            echo "✅ SSH tunnel established"
            ps aux | grep ssh | grep -v grep
          else
            echo "❌ SSH tunnel process not found"
            ps aux | grep ssh | grep -v grep || echo "No SSH processes running"
            exit 1
          fi



      # Test tunnel connection
      - name: Test SSH tunnel
        run: |
          nc -zv localhost ${{ vars.LOCAL_PORT }} || echo "⚠️ Warning: Tunnel test failed"

      # Install Flyway CLI
      - name: Install Flyway
        run: |
          wget -qO- https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/10.10.0/flyway-commandline-10.10.0-linux-x64.tar.gz | tar -xvz
          sudo ln -s $(pwd)/flyway-10.10.0/flyway /usr/local/bin/flyway
          flyway --version

      # Run Flyway migrations through SSH tunnel
      - name: Run Flyway migrations
        run: |
          flyway \
            -url="jdbc:postgresql://localhost:${{ vars.LOCAL_PORT }}/${{ secrets.DB_NAME }}" \
            -user="${{ secrets.DB_USER }}" \
            -password="${{ secrets.DB_PASSWORD }}" \
            -locations="filesystem:./migrations" \
            -baselineOnMigrate=true \
            migrate
        env:
          FLYWAY_EDITION: community

      # Close SSH tunnel
      - name: Close SSH tunnel
        if: always()
        run: |
          pkill -f "ssh -f -N -L ${{ vars.LOCAL_PORT }}" || echo "No tunnel to close"
          echo "✅ SSH tunnel closed"

      - name: Download and Install Semarchy Design CLI
        run: |
          echo "Installing Design CLI from repository"
          npm install -g ./tools/semarchy-sem-design-*.tgz
          
          echo "Verifying installation"
          sem-design --version

      - name: Deploy to Data Management
        run: |
          sem-design dm data-location deploy \
            --client-id ${{ secrets.SEMARCHY_CLIENT_ID }} \
            --client-secret ${{ secrets.SEMARCHY_CLIENT_SECRET }} \
            --data-location ${{ vars.SEMARCHY_DATA_LOCATION }} \
            --data-source ${{ vars.SEMARCHY_DATA_SOURCE }} \
            --instance-url ${{ vars.SEMARCHY_INSTANCE_URL }} \
            --root-folder ./src
        
      - name: Check deployment status
        if: success()
        run: echo "✅ Deployment completed successfully"
        
      - name: Handle deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed"
